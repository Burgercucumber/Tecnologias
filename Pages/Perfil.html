<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | OdontoGo</title>

  <!-- Estilos globales + estilos de perfil (mismo set que usa la versión con cuenta) -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/Perfil.css">
</head>
<body>
  <!-- Si YA hay sesión, manda a la versión con cuenta -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('odg_auth') === '1') {
          location.replace('./PerfilC.html?tab=info');
        }
      } catch {}
    })();
  </script>

  <!-- 🧭 NAVBAR -->
  <div id="header-placeholder"></div>

  <!-- 🧩 CONTENIDO -->
  <main class="container" style="padding:18px 16px 36px;">
    <div class="wrap">
      <!-- 📂 ASIDE / MENÚ -->
      <aside class="panel">
        <div class="aside-head">
          <div class="user-mini">
            <img src="https://c1.klipartz.com/pngpicture/179/340/sticker-png-icon-login-user-computer-user-interface-registered-user-icon-design-computer-software-material-property.png" alt="Usuario">
            <div>
              <div>Invitado</div>
              <div class="muted" style="font-weight:500;">No has iniciado sesión</div>
            </div>
          </div>
        </div>

        <ul class="menu" id="public-tabs" role="tablist" aria-label="Secciones del perfil público">
          <li role="tab" tabindex="0" data-section="info"          class="active" aria-selected="true">Información</li>
          <li role="tab" tabindex="0" data-section="favoritos"     aria-selected="false">Favoritos</li>
          <li role="tab" tabindex="0" data-section="historial"     aria-selected="false">Historial</li>
          <li role="tab" tabindex="0" data-section="agenda"        aria-selected="false">Agenda</li>
          <li role="tab" tabindex="0" data-section="pagos"         aria-selected="false">Pagos</li>
          <li role="tab" tabindex="0" data-section="configuracion" aria-selected="false">Configuración</li>
          <li role="tab" tabindex="0" data-section="recomendaciones" aria-selected="false">¡Recomendaciones!</li>
        </ul>
      </aside>

      <!-- 🩺 PANEL DE MENSAJE CENTRAL -->
      <section id="public-view" class="perfil-info active" role="tabpanel" aria-live="polite"></section>
    </div>
  </main>

  <!-- Helpers del header -->
  <script src="../js/session-ui.js"></script>

  <!-- Script mínimo para cambiar los mensajes por sección (contenido intacto) -->
  <script>
    (function () {
      const $  = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];

      // Mensajes por sección (pública / sin cuenta) — MISMO CONTENIDO
      const MSG = {
        info: `
          <div class="card-like">
            <h2>Información</h2>
            <p>Aquí verás tus datos personales y médicos básicos una vez crees tu cuenta.</p>
            <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
          </div>
        `,
        favoritos: `
          <div class="card-like">
            <h2>Favoritos</h2>
            <p>Guarda clínicas y tratamientos como favoritos para acceder rápido desde tu perfil.</p>
            <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
          </div>
        `,
        historial: `
          <div class="card-like">
            <h2>Historial</h2>
            <p>Consulta tu historial de citas, tratamientos y documentos clínicos cuando tengas cuenta.</p>
            <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
          </div>
        `,
        agenda: `
          <div class="card-like">
            <h2>Agenda</h2>
            <p>Programa nuevas citas, reagenda y recibe recordatorios al activar tu cuenta.</p>
            <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
          </div>
        `,
        pagos: `
          <div class="card-like">
            <h2>Pagos</h2>
            <p>Visualiza facturas, estados de pago y planes adquiridos con tu sesión activa.</p>
            <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
          </div>
        `,
        configuracion: `
          <div class="card-like">
            <h2>Configuración</h2>
            <p>Elige idioma, privacidad y notificaciones después de iniciar sesión.</p>
            <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
          </div>
        `,
        recomendaciones: `
          <div class="card-like">
            <h2>Recomendaciones</h2>
            <p>Descubre lugares de turismo cercanos a tus clínicas favoritas al registrarte.</p>
            <p><a href="./login.html" class="btn outline">Ver recomendaciones</a></p>
          </div>
        `
      };

      const view = $('#public-view');

      function render(section) {
        const html = MSG[section] || MSG.info;
        // el panel central respeta el mismo estilo (card-like)
        view.classList.add('active');
        view.innerHTML = html;

        // actualizar estado visual/accesible del menú
        $$('#public-tabs [role="tab"]').forEach(t => {
          const isActive = t.dataset.section === section;
          t.classList.toggle('active', isActive);
          t.setAttribute('aria-selected', String(isActive));
        });
      }

      // iniciar con "info"
      render('info');

      // click/teclado en tabs
      $$('#public-tabs [role="tab"]').forEach(tab => {
        const activate = () => render(tab.dataset.section);
        tab.addEventListener('click', activate);
        tab.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            activate();
          }
        });
      });
    })();
  </script>

  <!-- 📦 CARGAR HEADER DINÁMICAMENTE -->
  <script src="../js/header_loader.js"></script>
</body>
</html>
