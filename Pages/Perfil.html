<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | OdontoGo</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
  <!-- Si YA hay sesión, manda a la versión con cuenta -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('odg_auth') === '1') {
          location.replace('./PerfilC.html?tab=info');
        }
      } catch {}
    })();
  </script>

  <!-- 🧭 NAVBAR -->
   <header class="navbar">
    <div class="navbar-left">
      <img src="../img/logo.png" alt="Logo OdontoGo" class="logo">
      <h1>OdontoGo</h1>
    </div>

    <!-- NAV central: chips + dropdowns -->
    <nav class="navbar-center chips-bar" id="chipsBar">
      <button class="chip-btn" data-link="#" aria-label="Odontologías">
        <span class="chip-ico">🧰</span>
        <span>Odontologías</span>
      </button>

      <button class="chip-btn" id="chipLocalidad" data-dd="dd-localidad" aria-expanded="false" aria-controls="dd-localidad">
        <span class="chip-ico">📍</span>
        <span>Localidad</span>
        <span class="chip-caret">▾</span>
      </button>

      <button class="chip-btn" id="chipTratamientos" data-dd="dd-tratamientos" aria-expanded="false" aria-controls="dd-tratamientos">
        <span class="chip-ico">🦷</span>
        <span>Tratamientos</span>
        <span class="chip-caret">▾</span>
      </button>
    </nav>

    <div class="navbar-right">
      <div class="search-bar">
        <input type="text" placeholder="Buscar..." aria-label="Buscar" />
        <button>Buscar</button>
      </div>

      <!-- Perfil + menú desplegable -->
      <div class="profile-menu" id="profileMenu">
        <a id="profileTrigger"
           href="#"
           class="profile-trigger"
           aria-expanded="false"
           aria-haspopup="true"
           title="Cuenta">
          <img src="../img/icon-user.png" alt="Perfil" class="icono-perfil">
        </a>

        <!-- Menú desplegable -->
        <nav class="profile-dropdown" role="menu" aria-label="Menú de usuario">
          <!-- Mi área = pestaña "info" por defecto -->
          <a role="menuitem" href="Pages/Perfil.html?tab=info">
            <span class="pm-ico">👤</span> Mi área
          </a>

          <a role="menuitem" href="Pages/Perfil.html?tab=historial">
            <span class="pm-ico">📋</span> Historial clínico
          </a>

          <a role="menuitem" href="Pages/Perfil.html?tab=favoritos">
            <span class="pm-ico">⭐</span> Mis favoritos
          </a>

          <a role="menuitem" href="Pages/Perfil.html?tab=agenda">
            <span class="pm-ico">🔔</span> Mis alertas
          </a>

          <a role="menuitem" href="Pages/Perfil.html?tab=configuracion">
            <span class="pm-ico">⚙️</span> Configuración
          </a>

          <button role="menuitem" id="pm-auth" class="pm-logout">
            <span class="pm-ico">⏻</span> Iniciar sesión
          </button>
        </nav>
      </div>
      <!-- /Perfil + menú -->
    </div>
  </header>

  <!-- 🧩 CONTENEDOR PRINCIPAL -->
  <main class="perfil-container">
    <!-- 📂 MENÚ LATERAL -->
    <aside class="menu-lateral" aria-label="Menú de secciones">
      <div class="usuario">
        <img src="../img/user-placeholder.png" alt="Usuario">
        <h3>Invitado</h3>
      </div>

      <ul class="opciones" role="tablist" id="public-tabs">
        <li role="tab" tabindex="0" data-section="info"          aria-selected="true">Información</li>
        <li role="tab" tabindex="0" data-section="favoritos"     aria-selected="false">Favoritos</li>
        <li role="tab" tabindex="0" data-section="historial"     aria-selected="false">Historial</li>
        <li role="tab" tabindex="0" data-section="agenda"        aria-selected="false">Agenda</li>
        <li role="tab" tabindex="0" data-section="pagos"         aria-selected="false">Pagos</li>
        <li role="tab" tabindex="0" data-section="configuracion" aria-selected="false">Configuración</li>
      </ul>

      <button class="recomendaciones" id="btn-recom-public">
        ¡Recomendaciones!
      </button>
    </aside>

    <!-- 🩺 PANEL DE MENSAJES -->
    <section class="perfil-info active" id="public-view" role="tabpanel" aria-live="polite"></section>
  </main>

  <!-- Helpers de menú/estado -->
  <script src="../js/session-ui.js"></script>

  <!-- Script mínimo para cambiar los mensajes por sección -->
  <script>
    (function () {
      const $  = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];

      // Mensajes por sección (pública / sin cuenta)
      const MSG = {
        info: `
          <h2>Información</h2>
          <p>Aquí verás tus datos personales y médicos básicos una vez crees tu cuenta.</p>
          <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
        `,
        favoritos: `
          <h2>Favoritos</h2>
          <p>Guarda clínicas y tratamientos como favoritos para acceder rápido desde tu perfil.</p>
          <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
        `,
        historial: `
          <h2>Historial</h2>
          <p>Consulta tu historial de citas, tratamientos y documentos clínicos cuando tengas cuenta.</p>
          <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
        `,
        agenda: `
          <h2>Agenda</h2>
          <p>Programa nuevas citas, reagenda y recibe recordatorios al activar tu cuenta.</p>
          <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
        `,
        pagos: `
          <h2>Pagos</h2>
          <p>Visualiza facturas, estados de pago y planes adquiridos con tu sesión activa.</p>
          <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
        `,
        configuracion: `
          <h2>Configuración</h2>
          <p>Elige idioma, privacidad y notificaciones después de iniciar sesión.</p>
          <p><a href="./login.html" class="btn">Crear cuenta / Iniciar sesión</a></p>
        `,
        recomendaciones: `
          <h2>Recomendaciones</h2>
          <p>Descubre lugares de turismo cercanos a tus clínicas favoritas al registrarte.</p>
          <p><a href="./login.html" class="btn outline">Ver recomendaciones</a></p>
        `
      };

      const view = $('#public-view');

      function render(section) {
        const html = MSG[section] || MSG.info;
        view.innerHTML = `<div class="panel padded card-like">${html}</div>`;
      }

      // Inicializar con "info"
      render('info');

      // Click/teclado en tabs
      $$('#public-tabs [role="tab"]').forEach(tab => {
        const activate = () => {
          const section = tab.dataset.section;
          // aria-selected y clases activas
          $$('#public-tabs [role="tab"]').forEach(t => t.setAttribute('aria-selected', 'false'));
          tab.setAttribute('aria-selected', 'true');
          render(section);
        };
        tab.addEventListener('click', activate);
        tab.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            activate();
          }
        });
      });

      // Botón de recomendaciones (pública): muestra mensaje y CTA
      const btnRecom = document.getElementById('btn-recom-public');
      if (btnRecom) {
        btnRecom.addEventListener('click', () => {
          // Marcar activo en la lista (si existe la opción)
          const li = $('#public-tabs [data-section="recomendaciones"]');
          if (li) {
            $$('#public-tabs [role="tab"]').forEach(t => t.setAttribute('aria-selected', 'false'));
            li.setAttribute('aria-selected', 'true');
          }
          render('recomendaciones');
          // scroll suave al panel
          setTimeout(() => document.getElementById('public-view')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
        });
      }
    })();
  </script>

  <style>
    /* Mini ayudita visual: usa estilos existentes sin cambiar layout general */
    .card-like{
      background:#fff; border-radius:14px; box-shadow:0 10px 24px rgba(0,0,0,.08); padding:18px;
    }
    .card-like h2{ margin-top:0; }
    .btn{ border:none; border-radius:999px; padding:10px 16px; font-weight:700; cursor:pointer; }
    .btn.outline{ background:#fff; color:#0ec28b; border:2px solid #0ec28b; }
  </style>
</body>
</html>
