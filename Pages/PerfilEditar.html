<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar perfil | OdontoGo</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/perfil.css"/>
  <style>
    .form-card{background:#fff;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.08);padding:18px;max-width:900px;margin:18px auto;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field input{padding:10px 12px;border-radius:10px;border:1px solid #d8e1e7;outline:0}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
    .btn{background:#0ec28b;color:#fff;border:none;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}
    .btn.outline{background:#fff;color:#0ec28b;border:2px solid #0ec28b}
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <img src="../img/logo.png" alt="Logo OdontoGo" class="logo"/>
      <h1>OdontoGo</h1>
    </div>
  </header>
  
<div class="topbar">
  <h2 id="titulo" class="section-title"></h2>
  <a href="./PerfilC.html?tab=info" class="btn outline">Regresar</a>
</div>
  <main class="container" style="padding:18px 16px 36px;">
    <div class="form-card" role="region" aria-labelledby="titulo">
      <div class="topbar"><h2 id="titulo" class="section-title">Editar perfil</h2></div>

      <form id="form-perfil">
        <div class="grid2">
          <div class="field">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" autocomplete="name" required/>
          </div>
          <div class="field">
            <label for="email">Correo</label>
            <input id="email" name="email" type="email" autocomplete="email" required/>
          </div>
          <div class="field">
            <label for="telefono">Teléfono</label>
            <input id="telefono" name="telefono" type="tel" autocomplete="tel"/>
          </div>
          <div class="field">
            <label for="nacimiento">Fecha de nacimiento</label>
            <input id="nacimiento" name="nacimiento" type="date"/>
          </div>
          <div class="field" style="grid-column:1 / -1">
            <label for="ubicacion">Ubicación</label>
            <input id="ubicacion" name="ubicacion" type="text" placeholder="Ciudad / barrio"/>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="btn-cancelar" class="btn outline">Cancelar</button>
          <button type="submit" class="btn">Guardar cambios</button>
        </div>
        <p id="msg" class="muted" aria-live="polite" style="margin-top:8px;"></p>
      </form>
    </div>
  </main>
  <script src="../js/perfil-edit.js" defer></script>
</body>
</html>
