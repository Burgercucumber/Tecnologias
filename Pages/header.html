<style>
/* CRÍTICO: Evitar que los SVG y elementos internos interfieran con los clicks */
.chip-btn *,
.chip-ico *,
.chip-btn svg,
.chip-btn svg * {
  pointer-events: none;
}

/* Asegurar que el botón sí capture clicks */
.chip-btn {
  pointer-events: auto;
}

.dd-panel {
  position: absolute;
  min-width: 240px;
  width: auto;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 24px 48px rgba(0,0,0,.14);
  padding: 10px 0;
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px);
  transition: opacity .18s ease, transform .18s ease, visibility .18s;
  z-index: 50;
  max-height: 400px;
  overflow-y: auto;
}

.dd-panel.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.dd-option {
  padding: 10px 16px;
  cursor: pointer;
  transition: background-color 0.15s ease;
  color: #213A57;
  font-size: 14px;
}

.dd-option:hover {
  background-color: #f6f8f9;
}

/* Menú desplegable del perfil */
.profile-menu {
  position: relative;
}

.profile-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 220px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0,0,0,.12);
  padding: 8px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
  z-index: 100;
  max-height: 400px;
  overflow-y: auto;
}

.profile-menu.open .profile-dropdown {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

/* Items del dropdown */
.profile-dropdown a,
.profile-dropdown button {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 14px;
  border-radius: 8px;
  text-decoration: none;
  color: #243333;
  font-size: 14px;
  border: none;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  text-align: left;
}

.profile-dropdown a:hover,
.profile-dropdown button:hover {
  background: #f6f8f9;
}

/* Botón de logout específico */
.pm-logout {
  margin-top: 4px;
  padding-top: 12px;
  border-top: 1px solid #e8ecef;
  color: #213A57;
  font-weight: 500;
}

/* ===== ICONOS DEL MENÚ DE PERFIL (AISLADOS) ===== */
.profile-menu .pm-ico,
.profile-menu .pm-ico * {
  pointer-events: none;
}

.profile-menu .pm-ico svg {
  width: 1.1em; height: 1.1em;
  display: inline-block;
  vertical-align: -0.15em;
  overflow: visible;
  color: #213A57; fill: currentColor; stroke: none;
}

/* El "trigger" del perfil debe capturar el click, no su contenido */
.profile-trigger { pointer-events: auto; }
.profile-trigger * { pointer-events: none; }

/* ===== ICONOS DE CHIPS (TRATAMIENTOS/LOCALIDAD) AISLADOS ===== */
.chips-bar .chip-btn .chip-ico,
.chips-bar .chip-btn .chip-ico *,
.chips-bar .chip-btn svg,
.chips-bar .chip-btn svg * {
  pointer-events: none;
}

.chips-bar .chip-btn .chip-ico svg {
  width: 20px; height: 20px;
  display: inline-block;
  vertical-align: -0.2em;
  overflow: visible;
  color: #213A57; fill: none; stroke: currentColor;
}

/* El botón SÍ recibe el click */
.chips-bar .chip-btn { pointer-events: auto; }

/* ===== CAPAS Y SUPERPOSICIÓN SEGURA ===== */
.navbar-center { position: relative; z-index: 20; }
.profile-menu  { position: relative; z-index: 10; }
.dd-panel      { z-index: 2000; }
.profile-dropdown { z-index: 1500; }
</style>
