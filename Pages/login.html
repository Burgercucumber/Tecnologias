<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión | OdontoGo</title>
  <link rel="stylesheet" href="../css/style.css"/>

  <style>
    /* Estilos mínimos del card */
    body{background:#f6fafc; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Helvetica,Arial;}
    .auth-wrap{min-height:100vh; display:grid; place-items:center; padding:24px;}
    .auth-card{width:100%; max-width:430px; background:#fff; border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,.08); padding:28px;}
    .tabs{display:flex; gap:8px; margin-bottom:18px;}
    .tabs button{flex:1; padding:10px 12px; border-radius:10px; border:1px solid #e6eef2; background:#f7fbfd; cursor:pointer;}
    .tabs button.active{background:#e9fbf5; border-color:#c7f1de; color:#148a66; font-weight:600;}
    .form-group{margin:12px 0;}
    label{display:block; font-size:.9rem; color:#334; margin-bottom:6px;}
    input{width:100%; border:1px solid #dde7ee; border-radius:10px; padding:12px 14px; outline:none;}
    input:focus{border-color:#76e7c1; box-shadow:0 0 0 3px rgba(118,231,193,.25);}
    .btn{width:100%; padding:12px; border:0; border-radius:999px; cursor:pointer; font-weight:600;}
    .btn-primary{background:#00c389; color:#fff;}
    .muted{color:#667; font-size:.9rem; text-align:center; margin-top:12px;}
    .demo-box{background:#fff8d7; border:1px solid #f4e6a4; padding:10px 12px; border-radius:10px; font-size:.9rem; margin-bottom:10px;}
    .err{color:#b00020; font-size:.9rem; margin-top:8px; min-height:1em;}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h2 style="margin:0 0 8px">Bienvenido a <span style="color:#0b6fa4">OdontoGo</span></h2>
      <p class="muted" style="margin-top:0">Usa el demo o crea una cuenta de prueba.</p>

      <div class="demo-box">
        <strong>Usuario demo</strong><br/>
        Correo: <code>demo@odontogo.com</code><br/>
        Contraseña: <code>123456</code>
      </div>

      <div class="tabs">
        <button id="tab-login" class="active">Iniciar sesión</button>
        <button id="tab-register">Crear cuenta</button>
      </div>

      <!-- Login -->
      <form id="form-login">
        <div class="form-group">
          <label>Correo</label>
          <input type="email" id="login-email" required placeholder="correo@ejemplo.com"/>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-pass" required placeholder="••••••"/>
        </div>
        <button class="btn btn-primary" type="submit">Entrar</button>
        <div id="login-err" class="err"></div>
      </form>

      <!-- Register -->
      <form id="form-register" style="display:none">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="reg-name" required placeholder="Tu nombre"/>
        </div>
        <div class="form-group">
          <label>Correo</label>
          <input type="email" id="reg-email" required placeholder="correo@ejemplo.com"/>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reg-pass" required minlength="6" placeholder="Mínimo 6 caracteres"/>
        </div>
        <button class="btn btn-primary" type="submit">Crear cuenta</button>
        <div class="muted" style="margin-top:8px">* Solo para demo. No guarda datos reales.</div>
        <div id="reg-err" class="err"></div>
      </form>

      <p class="muted"><a href="../index.html">Volver al inicio</a></p>
    </div>
  </div>

  <!-- Tu control de sesión (si lo usas en otras páginas) -->
  <script src="../js/sesion-ui.js"></script>
  <!-- Motor de auth local -->
  <script src="../js/auth.js"></script>
  <script>
    // Tabs
    const tabLogin  = document.getElementById('tab-login');
    const tabReg    = document.getElementById('tab-register');
    const fLogin    = document.getElementById('form-login');
    const fReg      = document.getElementById('form-register');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active'); tabReg.classList.remove('active');
      fLogin.style.display = ''; fReg.style.display = 'none';
    });
    tabReg.addEventListener('click', () => {
      tabReg.classList.add('active'); tabLogin.classList.remove('active');
      fReg.style.display = ''; fLogin.style.display = 'none';
    });

    const params   = new URLSearchParams(location.search);
    const redirect = params.get('redirect') || '../index.html';

    // Login
    fLogin.addEventListener('submit', (e)=>{
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass  = document.getElementById('login-pass').value;
      const out   = document.getElementById('login-err');
      out.textContent = '';
      try {
        auth.login(email, pass);
        location.href = redirect;
      } catch (err) {
        out.textContent = err.message || 'Error al iniciar sesión';
      }
    });

    // Register
    fReg.addEventListener('submit', (e)=>{
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email= document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-pass').value;
      const out  = document.getElementById('reg-err');
      out.textContent = '';
      try {
        auth.register(name, email, pass);
        location.href = redirect;
      } catch (err) {
        out.textContent = err.message || 'No se pudo crear la cuenta';
      }
    });
  </script>
</body>
</html>
