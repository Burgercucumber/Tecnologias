<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión | OdontoGo</title>

  <!-- Puedes reutilizar tu style.css para tipografías/botones -->
  <link rel="stylesheet" href="../css/style.css"/>

  <style>
    /* Estilos mínimos para la tarjeta (según tu mockup) */
    body{
      min-height:100dvh; display:grid; place-items:center;
      background: #f6f9fb;
    }
    .login-card{
      width: 560px; max-width: 92vw;
      background:#fff; border-radius:16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.12);
      padding: 28px 28px 24px;
    }
    .login-card h2{
      margin: 0 0 10px;
      font-size: 18px; font-weight: 600; color:#1c2b3a;
      text-align: center;
    }
    .login-card .logo-user{
      width:64px; height:64px; border-radius:50%;
      display:grid; place-items:center; margin:8px auto 12px;
      background:#eef6ff; color:#6aa8ff; font-size:30px;
    }
    .login-card form{
      margin-top: 6px;
    }
    .field{
      margin: 10px 0;
    }
    .field label{
      display:block; font-size:13px; color:#374151; margin-bottom:6px;
    }
    .field input{
      width:100%; height:40px; border-radius:8px;
      border:1px solid #d9e1e8; outline:none;
      padding:0 12px; font-size:14px;
    }
    .field input:focus{ border-color:#8fd9c4; box-shadow:0 0 0 3px rgba(0,200,155,.15); }

    .actions{
      display:flex; align-items:center; justify-content:space-between;
      margin-top: 8px; gap:14px;
    }
    .actions .remember{
      display:flex; align-items:center; gap:8px; font-size:13px; color:#374151;
    }
    .actions a{ font-size:13px; color:#0ea5a5; text-decoration:none; }
    .actions a:hover{ text-decoration:underline; }

    .btn-login{
      display:block; width:100%; height:44px; border:0; border-radius:10px;
      background:linear-gradient(90deg,#41e3a4,#8df3c1);
      color:#0b2b33; font-weight:700; font-size:15px; margin-top:16px;
      box-shadow: 0 10px 22px rgba(0,180,140,.25); cursor:pointer;
    }
    .btn-login:hover{ filter:brightness(1.02); }

    .go-home{
      display:block; text-align:center; margin-top:10px; font-size:13px;
      color:#0ea5a5; text-decoration:none;
    }
    .go-home:hover{ text-decoration:underline; }
  </style>
</head>

<body>
  <div class="login-card">
    <h2>Inicia sesión con tu cuenta OdontoGo</h2>
    <div class="logo-user">👤</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Correo:</label>
        <input id="email" name="email" type="email" placeholder="tucorreo@dominio.com" required/>
      </div>

      <div class="field">
        <label for="password">Contraseña:</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required/>
      </div>

      <div class="actions">
        <label class="remember"><input type="checkbox" /> No cerrar sesión</label>
        <a href="#" title="Ayuda">¿Necesitas ayuda?</a>
      </div>

      <button class="btn-login" type="submit">Iniciar sesión</button>
      <a class="go-home" href="../index.html">← Volver al inicio</a>
    </form>
  </div>

  <!-- Sesión + Login JS -->
  <script src="../js/session-ui.js" defer></script>
  <script src="../js/auth.js" defer></script>
</body>
</html>
